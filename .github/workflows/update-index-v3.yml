name: Update Index v3

on:
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sunday at 02:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run mode (diff analysis only, no upload)'
        required: false
        type: boolean
        default: false
      force_upload:
        description: 'Force upload even if validation fails (NOT RECOMMENDED)'
        required: false
        type: boolean
        default: false

# Court guides are excluded from this workflow — they rarely change and are
# updated manually via scripts/court_guides_processing_pipeline/ when new
# editions are published.

permissions:
  id-token: write
  contents: read

concurrency:
  group: update-index-v3-${{ github.ref }}
  cancel-in-progress: true

env:
  AZURE_SEARCH_INDEX: legal-court-rag-index-v3
  PYTHON_VERSION: '3.10'

jobs:
  # ──────────────────────────────────────────────────────────────────────────────
  # Step 1: Scrape CPR documents from legislation.gov.uk and validate
  # (No approval required — this step does not touch Azure resources)
  # ──────────────────────────────────────────────────────────────────────────────
  scrape-and-validate:
    runs-on: ubuntu-latest
    outputs:
      validation_status: ${{ steps.validate.outputs.status }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'requirements-dev.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Scrape Civil Procedure Rules
        run: python scripts/legal-scraper/scrape_cpr.py

      - name: Validate scraped content
        id: validate
        run: |
          if python scripts/legal-scraper/validate_and_review.py --input Upload; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi
        continue-on-error: true

      - name: Upload scraped data artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpr-scraped-data
          path: data/legal-scraper/processed/Upload/
          retention-days: 7

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpr-validation-reports
          path: data/legal-scraper/reports/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────────
  # Step 2: Diff analysis only
  # (No approval required — read-only comparison against the current index)
  # ──────────────────────────────────────────────────────────────────────────────
  diff-analysis:
    needs: scrape-and-validate
    if: needs.scrape-and-validate.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.diff.outputs.has_changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'requirements-dev.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Download CPR data
        uses: actions/download-artifact@v4
        with:
          name: cpr-scraped-data
          path: data/legal-scraper/processed/Upload/

      - name: Run diff analysis (dry run)
        id: diff
        run: |
          python scripts/legal-scraper/upload_with_embeddings.py --input Upload --dry-run
        env:
          AZURE_SEARCH_SERVICE: ${{ secrets.AZURE_SEARCH_SERVICE }}
          AZURE_SEARCH_INDEX: ${{ env.AZURE_SEARCH_INDEX }}
          AZURE_OPENAI_SERVICE: ${{ secrets.AZURE_OPENAI_SERVICE }}
          AZURE_OPENAI_EMB_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_EMB_DEPLOYMENT }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      - name: Create diff summary
        if: always()
        run: |
          echo "## 📋 Index v3 Update Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Target Index:** \`${{ env.AZURE_SEARCH_INDEX }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Run Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Source:** CPR (Civil Procedure Rules, Practice Directions, Pre-Action Protocols)" >> $GITHUB_STEP_SUMMARY
          echo "**Validation Status:** ${{ needs.scrape-and-validate.outputs.validation_status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "**Approval:** Not required for this run because \`dry_run\` is enabled." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.diff.outputs.has_changes }}" != "true" ]; then
            echo "**Approval:** Not required because the diff found no index changes." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.scrape-and-validate.outputs.validation_status }}" != "success" ] && [ "${{ github.event.inputs.force_upload }}" != "true" ]; then
            echo "**Approval:** Not required because validation failed and \`force_upload\` was not enabled." >> $GITHUB_STEP_SUMMARY
          else
            echo "**Approval:** A single Production approval will be requested before the upload job starts." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "data/legal-scraper/reports/upload_plan.txt" ]; then
            echo "### Diff Analysis" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat data/legal-scraper/reports/upload_plan.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No diff report generated." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload diff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diff-report
          path: data/legal-scraper/reports/
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────────────
  # Step 3: Upload to production index v3
  # (Requires Production environment approval only when a write will occur)
  # ──────────────────────────────────────────────────────────────────────────────
  upload-to-index:
    needs: [scrape-and-validate, diff-analysis]
    if: >-
      needs.scrape-and-validate.result == 'success' &&
      needs.diff-analysis.result == 'success' &&
      github.event.inputs.dry_run != 'true' &&
      needs.diff-analysis.outputs.has_changes == 'true' &&
      (needs.scrape-and-validate.outputs.validation_status == 'success' || github.event.inputs.force_upload == 'true')
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'requirements-dev.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Download CPR data
        uses: actions/download-artifact@v4
        with:
          name: cpr-scraped-data
          path: data/legal-scraper/processed/Upload/

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Add runner IP to search firewall
        id: firewall
        run: |
          RUNNER_IP=$(curl -s https://ifconfig.me)
          echo "Runner IP: ${RUNNER_IP}"
          echo "runner_ip=${RUNNER_IP}" >> $GITHUB_OUTPUT

          SEARCH_RAW="${{ secrets.AZURE_SEARCH_SERVICE }}"
          SEARCH_SVC="${SEARCH_RAW#https://}"
          SEARCH_SVC="${SEARCH_SVC#http://}"
          SEARCH_SVC="${SEARCH_SVC%%/*}"
          SEARCH_SVC="${SEARCH_SVC%%.search.windows.net}"
          echo "search_service=${SEARCH_SVC}" >> $GITHUB_OUTPUT

          SEARCH_ID=$(az resource list --resource-type "Microsoft.Search/searchServices" --name "${SEARCH_SVC}" --query "[0].id" -o tsv)
          if [ -z "${SEARCH_ID}" ]; then
            echo "Search service '${SEARCH_SVC}' was not found in the current subscription."
            exit 1
          fi
          SEARCH_RG=$(echo "${SEARCH_ID}" | sed -E 's|.*/resourceGroups/([^/]+)/.*|\1|')
          echo "search_resource_group=${SEARCH_RG}" >> $GITHUB_OUTPUT
          echo "Resolved search service '${SEARCH_SVC}' in resource group '${SEARCH_RG}'"

          CAPP_NAME="capps-backend-gz2m4s637t5me"

          CAPP_IPS=$(az containerapp show -g "${SEARCH_RG}" -n "${CAPP_NAME}" \
            --query "properties.outboundIpAddresses" -o tsv 2>/dev/null | tr '\t' '\n' | sort -u | head -100)
          echo "Container App outbound IPs count: $(echo "$CAPP_IPS" | wc -l)"

          ALL_IPS="${RUNNER_IP},90.241.195.154"
          for ip in ${CAPP_IPS}; do
            ALL_IPS="${ALL_IPS},${ip}"
          done
          echo "Total IPs for whitelist: $(echo "${ALL_IPS}" | tr ',' '\n' | wc -l)"

          echo "Adding IPs to search service firewall..."
          az search service update -g "${SEARCH_RG}" -n "${SEARCH_SVC}" \
            --ip-rules "${ALL_IPS}" 2>&1

          echo "Waiting 30s for firewall propagation..."
          sleep 30

          TOKEN=$(python3 -c "
          from azure.identity import ClientSecretCredential
          c = ClientSecretCredential('${{ secrets.AZURE_TENANT_ID }}', '${{ secrets.AZURE_CLIENT_ID }}', '${{ secrets.AZURE_CLIENT_SECRET }}')
          t = c.get_token('https://search.azure.com/.default')
          print(t.token)
          ")
          SEARCH_EP="https://${SEARCH_SVC}.search.windows.net"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${TOKEN}" \
            "${SEARCH_EP}/indexes('${{ env.AZURE_SEARCH_INDEX }}')/docs?\$top=1&\$select=id&api-version=2023-11-01")
          echo "Doc access after IP whitelist: HTTP ${STATUS}"

      - name: Upload to index v3
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 45
          max_attempts: 3
          retry_wait_seconds: 60
          command: python scripts/legal-scraper/upload_with_embeddings.py --input Upload
        env:
          AZURE_SEARCH_SERVICE: ${{ secrets.AZURE_SEARCH_SERVICE }}
          AZURE_SEARCH_INDEX: ${{ env.AZURE_SEARCH_INDEX }}
          AZURE_OPENAI_SERVICE: ${{ secrets.AZURE_OPENAI_SERVICE }}
          AZURE_OPENAI_EMB_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_EMB_DEPLOYMENT }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      - name: Upload statistics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upload-statistics
          path: data/legal-scraper/processed/upload_statistics.txt
          retention-days: 90

      - name: Post-upload summary
        if: always()
        run: |
          echo "## ⬆️ Upload Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Target Index:** \`${{ env.AZURE_SEARCH_INDEX }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "data/legal-scraper/processed/upload_statistics.txt" ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat data/legal-scraper/processed/upload_statistics.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Remove runner IP from search firewall
        if: always()
        run: |
          RUNNER_IP="${{ steps.firewall.outputs.runner_ip }}"
          SEARCH_SVC="${{ steps.firewall.outputs.search_service }}"
          SEARCH_RG="${{ steps.firewall.outputs.search_resource_group }}"
          if [ -n "${RUNNER_IP}" ]; then
            echo "Removing runner IP ${RUNNER_IP} from search service firewall..."
            az search service update -g "${SEARCH_RG}" -n "${SEARCH_SVC}" \
              --ip-rules "" 2>&1 || echo "Warning: failed to remove IP rule"
            echo "Search firewall cleaned up."
          fi
