name: Update Index v3

on:
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sunday at 02:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run mode (diff analysis only, no upload)'
        required: false
        type: boolean
        default: false
      force_upload:
        description: 'Force upload even if validation fails (NOT RECOMMENDED)'
        required: false
        type: boolean
        default: false

# Court guides are excluded from this workflow — they rarely change and are
# updated manually via scripts/court_guides_processing_pipeline/ when new
# editions are published.

permissions:
  id-token: write
  contents: read

concurrency:
  group: update-index-v3-${{ github.ref }}
  cancel-in-progress: true

env:
  AZURE_SEARCH_INDEX: legal-court-rag-index-v3
  PYTHON_VERSION: '3.10'

jobs:
  # ──────────────────────────────────────────────────────────────────────────────
  # Step 1: Scrape CPR documents from legislation.gov.uk and validate
  # (No approval required — this step does not touch Azure resources)
  # ──────────────────────────────────────────────────────────────────────────────
  scrape-and-validate:
    runs-on: ubuntu-latest
    outputs:
      validation_status: ${{ steps.validate.outputs.status }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'requirements-dev.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Scrape Civil Procedure Rules
        run: python scripts/legal-scraper/scrape_cpr.py

      - name: Validate scraped content
        id: validate
        run: |
          if python scripts/legal-scraper/validate_and_review.py --input Upload; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi
        continue-on-error: true

      - name: Upload scraped data artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpr-scraped-data
          path: data/legal-scraper/processed/Upload/
          retention-days: 7

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpr-validation-reports
          path: data/legal-scraper/reports/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────────
  # Step 2: Diff analysis + Upload to production index v3
  # (Requires Production environment approval — single gate for all Azure ops)
  # ──────────────────────────────────────────────────────────────────────────────
  upload-to-index:
    needs: scrape-and-validate
    if: needs.scrape-and-validate.result == 'success'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'requirements-dev.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Download CPR data
        uses: actions/download-artifact@v4
        with:
          name: cpr-scraped-data
          path: data/legal-scraper/processed/Upload/

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Diagnostic - test search data plane RBAC
        run: |
          echo "=== Search data-plane RBAC diagnostic ==="
          SEARCH_EP="https://${{ secrets.AZURE_SEARCH_SERVICE }}.search.windows.net"
          TOKEN=$(az account get-access-token --resource https://search.azure.com --query accessToken -o tsv)
          echo "Token length: ${#TOKEN}"

          # Decode JWT claims (header.payload.sig - decode payload)
          echo "--- JWT token claims ---"
          PAYLOAD=$(echo "$TOKEN" | cut -d'.' -f2 | tr '_-' '/+' | base64 -d 2>/dev/null || echo "$TOKEN" | cut -d'.' -f2 | tr '_-' '/+' | python3 -c "import sys,base64,json; p=sys.stdin.read().strip(); p+='='*(4-len(p)%4); print(json.dumps(json.loads(base64.b64decode(p)),indent=2))")
          echo "$PAYLOAD" | python3 -c "import sys,base64,json; raw=sys.stdin.read().strip(); padded=raw+'='*(4-len(raw)%4); claims=json.loads(base64.urlsafe_b64decode(padded)); print('aud:', claims.get('aud')); print('iss:', claims.get('iss')); print('appid:', claims.get('appid')); print('oid:', claims.get('oid')); print('sub:', claims.get('sub')); print('roles:', claims.get('roles')); print('scp:', claims.get('scp')); print('xms_r:', claims.get('xms_r'))" 2>/dev/null || echo "(JWT decode failed, trying alternative)"

          # Test document access with full response headers
          echo "--- Doc access (curl -i) ---"
          curl -s -i -H "Authorization: Bearer ${TOKEN}" \
            "${SEARCH_EP}/indexes('${{ env.AZURE_SEARCH_INDEX }}')/docs?\$top=1&\$select=id&api-version=2023-11-01" 2>&1 | head -30

          # Test index management
          echo "--- Idx management ---"
          IDX_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${TOKEN}" \
            "${SEARCH_EP}/indexes('${{ env.AZURE_SEARCH_INDEX }}')?api-version=2023-11-01&\$select=name")
          echo "Idx management HTTP: ${IDX_STATUS}"

          # List role assignments for SP on search service
          echo "--- RBAC assignments on search service ---"
          SP_OID=$(az ad sp show --id $(az account show --query user.name -o tsv) --query id -o tsv 2>/dev/null)
          echo "SP OID: ${SP_OID}"
          SEARCH_RID="/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/rg-cpr-rag-uksouth/providers/Microsoft.Search/searchServices/${{ secrets.AZURE_SEARCH_SERVICE }}"
          az role assignment list --assignee "${SP_OID}" --scope "${SEARCH_RID}" -o table 2>&1 || echo "Could not list role assignments"

          # Check for deny assignments
          echo "--- Deny assignments ---"
          az rest --method GET --url "${SEARCH_RID}/providers/Microsoft.Authorization/denyAssignments?api-version=2022-04-01" --query "value[].{name:denyAssignmentName,principal:principals[0].id}" -o table 2>&1 || echo "No deny assignments or cannot check"
        env:
          AZURE_SEARCH_SERVICE: ${{ secrets.AZURE_SEARCH_SERVICE }}

      - name: Run diff analysis (dry run)
        id: diff
        run: |
          python scripts/legal-scraper/upload_with_embeddings.py --input Upload --dry-run
        env:
          AZURE_SEARCH_SERVICE: ${{ secrets.AZURE_SEARCH_SERVICE }}
          AZURE_SEARCH_INDEX: ${{ env.AZURE_SEARCH_INDEX }}
          AZURE_OPENAI_SERVICE: ${{ secrets.AZURE_OPENAI_SERVICE }}
          AZURE_OPENAI_EMB_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_EMB_DEPLOYMENT }}

      - name: Check validation status
        id: check
        run: |
          validation="${{ needs.scrape-and-validate.outputs.validation_status }}"
          if [ "$validation" = "success" ]; then
            echo "validation_ok=true" >> $GITHUB_OUTPUT
          else
            echo "validation_ok=false" >> $GITHUB_OUTPUT
          fi

      - name: Create diff summary
        if: always()
        run: |
          echo "## 📋 Index v3 Update Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Target Index:** \`${{ env.AZURE_SEARCH_INDEX }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Run Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Source:** CPR (Civil Procedure Rules, Practice Directions, Pre-Action Protocols)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "data/legal-scraper/reports/upload_plan.txt" ]; then
            echo "### Diff Analysis" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat data/legal-scraper/reports/upload_plan.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No diff report generated." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload diff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diff-report
          path: data/legal-scraper/reports/
          retention-days: 30

      - name: Gate upload on validation and dry_run
        id: gate
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "🔍 Dry-run mode — skipping upload."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          validation="${{ steps.check.outputs.validation_ok }}"
          force="${{ github.event.inputs.force_upload }}"
          if [ "$validation" != "true" ] && [ "$force" != "true" ]; then
            echo "❌ Validation failed and force_upload not set — skipping upload."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Upload to index v3
        if: steps.gate.outputs.skip != 'true'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 45
          max_attempts: 3
          retry_wait_seconds: 60
          command: python scripts/legal-scraper/upload_with_embeddings.py --input Upload
        env:
          AZURE_SEARCH_SERVICE: ${{ secrets.AZURE_SEARCH_SERVICE }}
          AZURE_SEARCH_INDEX: ${{ env.AZURE_SEARCH_INDEX }}
          AZURE_OPENAI_SERVICE: ${{ secrets.AZURE_OPENAI_SERVICE }}
          AZURE_OPENAI_EMB_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_EMB_DEPLOYMENT }}

      - name: Upload statistics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upload-statistics
          path: data/legal-scraper/processed/upload_statistics.txt
          retention-days: 90

      - name: Post-upload summary
        if: always()
        run: |
          echo "## ⬆️ Upload Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Target Index:** \`${{ env.AZURE_SEARCH_INDEX }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "data/legal-scraper/processed/upload_statistics.txt" ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat data/legal-scraper/processed/upload_statistics.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
