name: Update Index v3

on:
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sunday at 02:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run mode (diff analysis only, no upload)'
        required: false
        type: boolean
        default: false
      force_upload:
        description: 'Force upload even if validation fails (NOT RECOMMENDED)'
        required: false
        type: boolean
        default: false

# Court guides are excluded from this workflow — they rarely change and are
# updated manually via scripts/court_guides_processing_pipeline/ when new
# editions are published.

permissions:
  id-token: write
  contents: read

concurrency:
  group: update-index-v3-${{ github.ref }}
  cancel-in-progress: true

env:
  AZURE_SEARCH_INDEX: legal-court-rag-index-v3
  PYTHON_VERSION: '3.10'

jobs:
  # ──────────────────────────────────────────────────────────────────────────────
  # Step 1: Scrape CPR documents from legislation.gov.uk and validate
  # (No approval required — this step does not touch Azure resources)
  # ──────────────────────────────────────────────────────────────────────────────
  scrape-and-validate:
    runs-on: ubuntu-latest
    outputs:
      validation_status: ${{ steps.validate.outputs.status }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'requirements-dev.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Reset scrape workspace
        run: |
          rm -rf data/legal-scraper/processed/Upload data/legal-scraper/reports
          mkdir -p data/legal-scraper/processed/Upload data/legal-scraper/reports

      - name: Scrape Civil Procedure Rules
        run: python scripts/legal-scraper/scrape_cpr.py

      - name: Validate scraped content
        id: validate
        run: |
          if python scripts/legal-scraper/validate_and_review.py --input Upload; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi
        continue-on-error: true

      - name: Verify CPR-only artifact contents
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          upload_dir = Path("data/legal-scraper/processed/Upload")
          bad_files = []
          for path in sorted(upload_dir.glob("*.json")):
              with path.open("r", encoding="utf-8") as handle:
                  doc = json.load(handle)
              if isinstance(doc, list):
                  sample = doc[0] if doc else {}
              else:
                  sample = doc
              category = sample.get("category")
              if category != "Civil Procedure Rules and Practice Directions":
                  bad_files.append(f"{path.name}: {category!r}")

          if bad_files:
              raise SystemExit(
                  "Non-CPR files detected in scrape artifact:\n" + "\n".join(bad_files)
              )
          PY

      - name: Upload scraped data artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpr-scraped-data
          path: data/legal-scraper/processed/Upload/
          retention-days: 7

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpr-validation-reports
          path: data/legal-scraper/reports/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────────
  # Step 2: Diff analysis only
  # (No approval required — read-only comparison against the current index)
  # ──────────────────────────────────────────────────────────────────────────────
  diff-analysis:
    needs: scrape-and-validate
    if: needs.scrape-and-validate.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.diff.outputs.has_changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'requirements-dev.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Reset diff workspace
        run: |
          rm -rf data/legal-scraper/processed/Upload data/legal-scraper/reports
          mkdir -p data/legal-scraper/processed/Upload data/legal-scraper/reports

      - name: Download CPR data
        uses: actions/download-artifact@v4
        with:
          name: cpr-scraped-data
          path: data/legal-scraper/processed/Upload/

      - name: Run diff analysis (dry run)
        id: diff
        run: |
          python scripts/legal-scraper/upload_with_embeddings.py --input Upload --dry-run
        env:
          AZURE_SEARCH_SERVICE: ${{ secrets.AZURE_SEARCH_SERVICE }}
          AZURE_SEARCH_INDEX: ${{ env.AZURE_SEARCH_INDEX }}
          AZURE_OPENAI_SERVICE: ${{ secrets.AZURE_OPENAI_SERVICE }}
          AZURE_OPENAI_EMB_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_EMB_DEPLOYMENT }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      - name: Create diff summary
        if: always()
        run: |
          echo "## 📋 Index v3 Update Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Target Index:** \`${{ env.AZURE_SEARCH_INDEX }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Run Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Source:** CPR (Civil Procedure Rules, Practice Directions, Pre-Action Protocols)" >> $GITHUB_STEP_SUMMARY
          echo "**Validation Status:** ${{ needs.scrape-and-validate.outputs.validation_status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "**Approval:** Not required for this run because \`dry_run\` is enabled." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.diff.outputs.has_changes }}" != "true" ]; then
            echo "**Approval:** Not required because the diff found no index changes." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.scrape-and-validate.outputs.validation_status }}" != "success" ] && [ "${{ github.event.inputs.force_upload }}" != "true" ]; then
            echo "**Approval:** Not required because validation failed and \`force_upload\` was not enabled." >> $GITHUB_STEP_SUMMARY
          else
            echo "**Approval:** A single Production approval will be requested before the upload job starts." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "data/legal-scraper/reports/upload_plan.txt" ]; then
            echo "### Diff Analysis" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat data/legal-scraper/reports/upload_plan.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No diff report generated." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload diff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diff-report
          path: data/legal-scraper/reports/
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────────────
  # Step 3: Upload to production index v3
  # (Requires Production environment approval only when a write will occur)
  # ──────────────────────────────────────────────────────────────────────────────
  upload-to-index:
    needs: [scrape-and-validate, diff-analysis]
    if: >-
      needs.scrape-and-validate.result == 'success' &&
      needs.diff-analysis.result == 'success' &&
      github.event.inputs.dry_run != 'true' &&
      needs.diff-analysis.outputs.has_changes == 'true' &&
      (needs.scrape-and-validate.outputs.validation_status == 'success' || github.event.inputs.force_upload == 'true')
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'requirements-dev.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Reset upload workspace
        run: |
          rm -rf data/legal-scraper/processed/Upload data/legal-scraper/reports
          mkdir -p data/legal-scraper/processed/Upload data/legal-scraper/reports

      - name: Download CPR data
        uses: actions/download-artifact@v4
        with:
          name: cpr-scraped-data
          path: data/legal-scraper/processed/Upload/

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Azure uploader runtime
        id: azure-uploader
        run: |
          APP_RG="rg-cpr-rag-uksouth"
          APP_NAME="capps-backend-gz2m4s637t5me"
          REGISTRY_SERVER=$(az containerapp show -g "${APP_RG}" -n "${APP_NAME}" --query "properties.template.containers[0].image" -o tsv | cut -d/ -f1)
          IDENTITY_ID=$(az containerapp show -g "${APP_RG}" -n "${APP_NAME}" --query "keys(identity.userAssignedIdentities)[0]" -o tsv)
          CLIENT_ID=$(az identity show --ids "${IDENTITY_ID}" --query clientId -o tsv)
          ACR_NAME="${REGISTRY_SERVER%%.azurecr.io}"
          IMAGE_TAG="legal-scraper-uploader:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          CONTAINER_NAME="legal-scraper-uploader-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          # Extract Azure service config from the deployed container app
          # (more reliable than separate GitHub secrets)
          SEARCH_SERVICE=$(az containerapp show -g "${APP_RG}" -n "${APP_NAME}" --query "properties.template.containers[0].env[?name=='AZURE_SEARCH_SERVICE'].value | [0]" -o tsv)
          OPENAI_SERVICE=$(az containerapp show -g "${APP_RG}" -n "${APP_NAME}" --query "properties.template.containers[0].env[?name=='AZURE_OPENAI_SERVICE'].value | [0]" -o tsv)
          OPENAI_EMB_DEPLOYMENT=$(az containerapp show -g "${APP_RG}" -n "${APP_NAME}" --query "properties.template.containers[0].env[?name=='AZURE_OPENAI_EMB_DEPLOYMENT'].value | [0]" -o tsv)

          echo "Resolved: SEARCH_SERVICE=${SEARCH_SERVICE} OPENAI_SERVICE=${OPENAI_SERVICE} EMB_DEPLOYMENT=${OPENAI_EMB_DEPLOYMENT}"

          echo "app_resource_group=${APP_RG}" >> $GITHUB_OUTPUT
          echo "registry_server=${REGISTRY_SERVER}" >> $GITHUB_OUTPUT
          echo "acr_name=${ACR_NAME}" >> $GITHUB_OUTPUT
          echo "identity_id=${IDENTITY_ID}" >> $GITHUB_OUTPUT
          echo "client_id=${CLIENT_ID}" >> $GITHUB_OUTPUT
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "container_name=${CONTAINER_NAME}" >> $GITHUB_OUTPUT
          echo "search_service=${SEARCH_SERVICE}" >> $GITHUB_OUTPUT
          echo "openai_service=${OPENAI_SERVICE}" >> $GITHUB_OUTPUT
          echo "openai_emb_deployment=${OPENAI_EMB_DEPLOYMENT}" >> $GITHUB_OUTPUT

      - name: Build Azure uploader image
        run: |
          az acr build \
            -r "${{ steps.azure-uploader.outputs.acr_name }}" \
            -t "${{ steps.azure-uploader.outputs.image_tag }}" \
            -f scripts/legal-scraper/Dockerfile.aci-uploader \
            .

      - name: Upload to index from Azure
        run: |
          mkdir -p data/legal-scraper/processed

          az container delete \
            -g "${{ steps.azure-uploader.outputs.app_resource_group }}" \
            -n "${{ steps.azure-uploader.outputs.container_name }}" \
            --yes >/dev/null 2>&1 || true

          az container create \
            -g "${{ steps.azure-uploader.outputs.app_resource_group }}" \
            -n "${{ steps.azure-uploader.outputs.container_name }}" \
            --os-type Linux \
            --image "${{ steps.azure-uploader.outputs.registry_server }}/${{ steps.azure-uploader.outputs.image_tag }}" \
            --registry-login-server "${{ steps.azure-uploader.outputs.registry_server }}" \
            --acr-identity "${{ steps.azure-uploader.outputs.identity_id }}" \
            --assign-identity "${{ steps.azure-uploader.outputs.identity_id }}" \
            --restart-policy Never \
            --cpu 2 \
            --memory 4 \
            --environment-variables \
              AZURE_CLIENT_ID="${{ steps.azure-uploader.outputs.client_id }}" \
              AZURE_SEARCH_SERVICE="${{ steps.azure-uploader.outputs.search_service }}" \
              AZURE_SEARCH_INDEX="${{ env.AZURE_SEARCH_INDEX }}" \
              AZURE_OPENAI_SERVICE="${{ steps.azure-uploader.outputs.openai_service }}" \
              AZURE_OPENAI_EMB_DEPLOYMENT="${{ steps.azure-uploader.outputs.openai_emb_deployment }}" \
            --command-line "python scripts/legal-scraper/upload_with_embeddings.py --input Upload" \
            --no-wait \
            -o none

          terminated=false
          for attempt in $(seq 1 120); do
            provisioning=$(az container show -g "${{ steps.azure-uploader.outputs.app_resource_group }}" -n "${{ steps.azure-uploader.outputs.container_name }}" --query provisioningState -o tsv 2>/dev/null || true)
            state=$(az container show -g "${{ steps.azure-uploader.outputs.app_resource_group }}" -n "${{ steps.azure-uploader.outputs.container_name }}" --query "containers[0].instanceView.currentState.state" -o tsv 2>/dev/null || true)
            exit_code=$(az container show -g "${{ steps.azure-uploader.outputs.app_resource_group }}" -n "${{ steps.azure-uploader.outputs.container_name }}" --query "containers[0].instanceView.currentState.exitCode" -o tsv 2>/dev/null || true)
            echo "ACI status: provisioning=${provisioning} state=${state} exitCode=${exit_code}"

            if [ "${state}" = "Terminated" ]; then
              terminated=true
              break
            fi

            if [ "${provisioning}" = "Failed" ]; then
              break
            fi

            sleep 15
          done

          # Retry log retrieval (Azure ACI logs endpoint can return transient 500s)
          for log_attempt in 1 2 3; do
            if az container logs \
              -g "${{ steps.azure-uploader.outputs.app_resource_group }}" \
              -n "${{ steps.azure-uploader.outputs.container_name }}" \
              > data/legal-scraper/processed/upload_statistics.txt 2>&1; then
              break
            fi
            echo "Log retrieval attempt ${log_attempt} failed, retrying in 5s..."
            sleep 5
          done

          echo "=== Container logs ==="
          cat data/legal-scraper/processed/upload_statistics.txt || true
          echo "=== End container logs ==="

          if [ "${terminated}" != "true" ]; then
            echo "Container did not reach a terminated state in time."
            az container show -g "${{ steps.azure-uploader.outputs.app_resource_group }}" -n "${{ steps.azure-uploader.outputs.container_name }}" --query 'instanceView.events[].{name:name,message:message}' -o table || true
            exit 1
          fi

          final_exit=$(az container show -g "${{ steps.azure-uploader.outputs.app_resource_group }}" -n "${{ steps.azure-uploader.outputs.container_name }}" --query "containers[0].instanceView.currentState.exitCode" -o tsv)
          echo "Azure uploader exit code: ${final_exit}"
          if [ "${final_exit}" != "0" ]; then
            exit 1
          fi

      - name: Upload statistics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upload-statistics
          path: data/legal-scraper/processed/upload_statistics.txt
          retention-days: 90

      - name: Post-upload summary
        if: always()
        run: |
          echo "## ⬆️ Upload Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Target Index:** \`${{ env.AZURE_SEARCH_INDEX }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "data/legal-scraper/processed/upload_statistics.txt" ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat data/legal-scraper/processed/upload_statistics.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Delete Azure uploader container
        if: always()
        run: |
          az container delete \
            -g "${{ steps.azure-uploader.outputs.app_resource_group }}" \
            -n "${{ steps.azure-uploader.outputs.container_name }}" \
            --yes || true
